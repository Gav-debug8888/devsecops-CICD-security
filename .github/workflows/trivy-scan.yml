# Standalone Trivy scan, run manually from the Actions tab.
name: Trivy Scan (manual)

on:
  workflow_dispatch:
    inputs:
      severity:
        description: "Severities to report"
        required: false
        default: "MEDIUM,HIGH,CRITICAL"

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy filesystem + image scan
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: inventory-api:scan
      SEVERITY: ${{ inputs.severity || 'MEDIUM,HIGH,CRITICAL' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Official setup action (avoids the risky `curl | sh` install pattern).
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true

      - run: trivy --version

      - name: Filesystem scan (deps, secrets, misconfig)
        run: |
          trivy fs . --scanners vuln,secret,misconfig --severity "$SEVERITY" \
            --format json --output trivy-fs.json

      - name: Build image
        run: docker build -t "$IMAGE_NAME" .

      - name: Image scan
        run: |
          trivy image "$IMAGE_NAME" --severity "$SEVERITY" \
            --format json --output trivy-image.json

      - name: Markdown summary of findings
        run: |
          summarise() {
            local file="$1" title="$2"
            echo "### $title" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            for s in CRITICAL HIGH MEDIUM LOW; do
              n=$(jq "[.Results[]? | (.Vulnerabilities // [])[], (.Misconfigurations // [])[], (.Secrets // [])[] | select(.Severity==\"$s\")] | length" "$file")
              echo "| $s | $n |" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| ID | Package / Rule | Severity | Installed | Fixed | Title |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----|----------------|----------|-----------|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.Results[]? | (.Vulnerabilities // [])[] |
              "| \(.VulnerabilityID) | \(.PkgName) | \(.Severity) | \(.InstalledVersion) | \(.FixedVersion // "-") | \((.Title // "") | gsub("\\|"; "/") | .[0:80]) |"' \
              "$file" | head -50 >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "## Trivy results (severity: $SEVERITY)" >> "$GITHUB_STEP_SUMMARY"
          summarise trivy-fs.json "Filesystem"
          summarise trivy-image.json "Container image"

      - name: Upload raw reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports
          path: trivy-*.json
